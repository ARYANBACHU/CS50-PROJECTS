<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History of Tennis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>History of Tennis</h1>
        <nav>
            <a href="index.html">Home</a> | <a href="rules.html">Rules</a> | <a href="players.html">Players</a>
        </nav>
    </header>

    <main>
        <section>
            <p>Tennis has a fascinating history that dates back to the 12th century</p>
            <button id="funFactBtn">Click for a Fun Fact!</button>
            <p id="funFact" style="display:none;">The first tennis balls were made of leather and stuffed with hair!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Love for Tennis. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById("funFactBtn").addEventListener("click", function () {
            const fact = document.getElementById("funFact");
            fact.style.display = fact.style.display === "none" ? "block" : "none";
        });
    </script>
